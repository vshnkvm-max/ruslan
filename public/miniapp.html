<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100002">
  <title>GAS SHOP — магазин</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23da2035'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='38' font-weight='900' fill='white'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/miniapp.css">
  <script id="telegram-sdk" src="https://telegram.org/js/telegram-web-app.js" async></script>
  <script src="/miniapp.js" defer></script>
</head>
<body>
  <div class="miniapp">
    <header class="topbar">
      <button class="profile-button" id="profile-button" aria-label="Открыть профиль" aria-haspopup="dialog">
        <svg class="shop-mark" viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="19"/><text x="21" y="25" text-anchor="middle">GAS</text></svg>
      </button>
      <strong id="shop-name">GAS SHOP</strong>
      <button id="fullscreen-button" class="fullscreen-button" aria-label="На весь экран" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></button>
    </header>

    <main>
      <section class="app-page" id="home-page" aria-label="Главная" tabindex="-1">
        <nav class="stories" aria-label="Информация о магазине">
          <button class="story" data-info="important" aria-label="Важно прочитать"><img src="/miniapp/important.svg" alt="" width="400" height="400"></button>
          <button class="story" data-info="referral" aria-label="Реферальная программа"><img src="/miniapp/referral.svg" alt="" width="400" height="400"></button>
          <button class="story" data-info="reviews" aria-label="Отзывы"><img src="/miniapp/reviews.svg" alt="" width="400" height="400"></button>
        </nav>

        <section id="banner" aria-label="Предложение магазина" hidden></section>

        <section class="catalog" id="catalog" aria-label="Каталог товаров">
          <div class="category-bar">
            <div id="categories" aria-label="Категории"></div>
          </div>
          <span id="count" class="sr-only" aria-live="polite"></span>
          <div class="catalog-viewport" id="catalog-viewport">
            <div class="catalog-page" id="catalog-page">
              <div class="catalog-status" id="status" role="status">Загружаем каталог…</div>
              <div class="products" id="products"></div>
            </div>
          </div>
        </section>
      </section>
      <section class="app-page" id="cart-page" aria-label="Корзина" tabindex="-1" hidden><div id="cart-content"></div></section>
    </main>

    <nav class="bottom-nav" aria-label="Основная навигация" data-active="catalog">
      <span class="nav-indicator" aria-hidden="true"></span>
      <button class="bottom-tab" id="catalog-tab" aria-controls="home-page" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>Главная</span></button>
      <button class="bottom-tab" id="cart-tab" aria-controls="cart-page"><span class="cart-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 4 2 1 2 12h12l2-9H6M10 21h.01M18 21h.01"/></svg><span id="cart-badge" hidden>0</span></span><span>Корзина</span></button>
    </nav>
  </div>

  <dialog id="details" aria-labelledby="detail-title">
    <span class="sheet-handle" aria-hidden="true"></span>
    <button class="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <div id="detail-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
